name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build installer and portable exe
        run: npm run dist
      - name: Save the installer files
        uses: actions/upload-artifact@v4
        with:
          name: Bismillah-Traders-POS-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
